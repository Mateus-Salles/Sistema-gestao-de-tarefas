services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/src/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 força TCP: só fica "healthy" depois que os scripts de init terminam
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:${APP_PORT:-3000}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
